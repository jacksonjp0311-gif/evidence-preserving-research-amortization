<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620">
<title>Illustrative accelerator accounting</title><desc>Synthetic arithmetic with a separate fixed GPU overhead.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#19384a} .axis{stroke:#42535c;stroke-width:2} .grid{stroke:#dce4e6;stroke-width:1} .small{font-size:18px} .label{font-size:21px} .title{font-size:29px;font-weight:700}</style>
<text x="75" y="52" class="title">Illustrative accelerator accounting</text><line class="axis" x1="300" y1="120" x2="300" y2="470"/><line class="grid" x1="300.0" y1="120" x2="300.0" y2="470"/><text x="300.0" y="500" text-anchor="middle" class="small">0</text><line class="grid" x1="397.1" y1="120" x2="397.1" y2="470"/><text x="397.1" y="500" text-anchor="middle" class="small">20</text><line class="grid" x1="494.3" y1="120" x2="494.3" y2="470"/><text x="494.3" y="500" text-anchor="middle" class="small">40</text><line class="grid" x1="591.4" y1="120" x2="591.4" y2="470"/><text x="591.4" y="500" text-anchor="middle" class="small">60</text><line class="grid" x1="688.6" y1="120" x2="688.6" y2="470"/><text x="688.6" y="500" text-anchor="middle" class="small">80</text><line class="grid" x1="785.7" y1="120" x2="785.7" y2="470"/><text x="785.7" y="500" text-anchor="middle" class="small">100</text><line class="grid" x1="882.9" y1="120" x2="882.9" y2="470"/><text x="882.9" y="500" text-anchor="middle" class="small">120</text><line class="grid" x1="980.0" y1="120" x2="980.0" y2="470"/><text x="980.0" y="500" text-anchor="middle" class="small">140</text><text x="280" y="174" text-anchor="end" class="small">Independent baseline</text><rect x="300" y="145" width="582.9" height="48" fill="#19384a"/><text x="894.9" y="177" class="label">120.0</text><text x="280" y="279" text-anchor="end" class="small">EPRA variable</text><rect x="300" y="250" width="267.1" height="48" fill="#087d7d"/><text x="579.1" y="282" class="label">55.0</text><text x="280" y="384" text-anchor="end" class="small">EPRA incl. fixed / N</text><rect x="300" y="355" width="291.4" height="48" fill="#c16e2d"/><text x="603.4" y="387" class="label">60.0</text><text x="640" y="555" text-anchor="middle" class="label">Hypothetical accelerator cost units per request</text><text x="75" y="605" class="small">Not GPU-joules, GPU-hours, telemetry, or measured financial cost.</text></svg>